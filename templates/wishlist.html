{% extends "base.html" %}
{% block title %}Wishlist{% endblock %}
{% block content %}
<h1>Wishlist</h1>
<div class="grid">
{% for item in items %}
<div class="card">
<img src="{{ item.product.image_url }}" alt="">
<h3>{{ item.product.name }}</h3>
<p>₹{{ "%.2f"|format(item.product.price) }}</p>
<a class="btn small" href="{{ url_for('products.product_detail', product_id=item.product.id) }}">View</a>
<a class="btn secondary small" href="{{ url_for('wishlist.toggle', product_id=item.product.id) }}">Remove</a>
</div>
{% else %}<p>Your wishlist is empty.</p>{% endfor %}
</div>
{% endblock %}
