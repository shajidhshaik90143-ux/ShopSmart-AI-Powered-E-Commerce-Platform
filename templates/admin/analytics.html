{% extends "base.html" %}
{% block title %}Analytics{% endblock %}
{% block content %}
<h1>Sales Analytics</h1>
<table><tr><th>Date</th><th>Product ID</th><th>Quantity</th><th>Amount</th></tr>
{% for s in sales %}<tr><td>{{ s.sale_date.strftime("%d %b %Y") }}</td><td>{{ s.product_id }}</td><td>{{ s.quantity }}</td><td>₹{{ "%.2f"|format(s.amount) }}</td></tr>{% endfor %}
</table>
{% endblock %}
